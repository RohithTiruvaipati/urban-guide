version: '3.8'

services:
  # Redis Streams broker & state coordination
  redis:
    image: redis:7.2-alpine
    container_name: proxy_system_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
